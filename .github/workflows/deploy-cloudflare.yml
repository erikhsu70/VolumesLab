name: Deploy web to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Best-effort CMS polling, not an immediate webhook. GitHub may delay runs.
    # Public-repo schedules pause after 60 days without repository activity;
    # re-enable in Actions if paused. No CMS credentials or changes are needed.
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: cloudflare-volumes-lab-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the production branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Check public CMS for changes
        id: cms
        run: node scripts/cms-snapshot.mjs --check
      - name: Test CMS synchronization safeguards
        if: steps.cms.outputs.changed == 'true'
        run: node --experimental-strip-types --test tests/cms-snapshot.test.mjs tests/cms-refresh.test.mjs
      - name: Install locked dependencies
        if: steps.cms.outputs.changed == 'true'
        run: npx --yes npm@11.19.0 ci --ignore-scripts
      - name: Check types
        if: steps.cms.outputs.changed == 'true'
        run: npx --no-install tsc --noEmit
      - name: Build web for Cloudflare
        if: steps.cms.outputs.changed == 'true'
        run: npm run build
        env:
          NITRO_PRESET: node_server
      - name: Prepare static HTML from validated CMS snapshot
        if: steps.cms.outputs.changed == 'true'
        run: |
          # Take a fresh snapshot after dependency installation/build, minimizing
          # the window during which an editor could invalidate the publication.
          node scripts/cms-snapshot.mjs
          node scripts/render-static.mjs
      - name: Deploy only the web Worker
        if: steps.cms.outputs.changed == 'true'
        run: npx --yes wrangler@4.158.0 deploy --config wrangler.static.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 013261f6c725024d2398f5856c8b5797
