name: Waitlist health
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check signup queue
        run: |
          body=$(curl -fsS --max-time 20 https://www.volumeslab.com/api/waitlist-health)
          echo "$body"
          echo "$body" | grep -q '"schema":true' && echo "$body" | grep -q '"status":"ok"'
